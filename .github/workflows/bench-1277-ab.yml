name: bench-1277-ab

on:
  push:
    branches: ["bench/1277-ab-20260925"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: c057ec6e7cacdcb1e264c6daf0fbdba3ae6f5323
      HEAD_SHA: 9a6c4daffadea5a7a64542deac5f02a69cd4c2c6
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install CPU benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenblas-dev python3-numpy

      - name: Prepare exact revisions
        run: |
          git worktree add --detach /tmp/vq-base "$BASE_SHA"
          git worktree add --detach /tmp/vq-head "$HEAD_SHA"

      - name: Build baseline and candidate
        run: |
          for label in base head; do
            root="/tmp/vq-${label}"
            cmake -S "$root" -B "$root/build" -G Ninja               -DVIBEQC_ENABLE_CUDA=OFF               -DCMAKE_BUILD_TYPE=Release
            cmake --build "$root/build" --parallel 4
            echo "===== ${label} BLAS cache ====="
            grep -Ei 'openblas|blas' "$root/build/CMakeCache.txt" || true
          done

      - name: Write restricted J-only microbenchmark
        run: |
          cat >/tmp/jonly_probe.cpp <<'CPP'
          #include <algorithm>
          #include <chrono>
          #include <cmath>
          #include <cstddef>
          #include <iomanip>
          #include <iostream>
          #include <numeric>
          #include <string>
          #include <vector>

          #include "scf/fock_build.hpp"
          #include "tensor/cpu_linalg.hpp"

          using Clock = std::chrono::steady_clock;

          int main() {
            using namespace vibeqc::scf;
            using namespace vibeqc::tensor;
            const auto diag = cpu_linalg_diagnostic();
            std::cout << std::setprecision(17);
            std::cout << "{\"provider\":\"" << cpu_linalg_provider_name(diag.provider)
                      << "\",\"external_provider\":" << (diag.external_provider ? "true" : "false")
                      << ",\"provider_threads\":" << diag.provider_threads
                      << ",\"rows\":[";
            bool first = true;
            for (std::size_t n : {24u, 32u, 40u}) {
              const std::size_t count = n * n;
              std::vector<double> eri(count * count);
              std::vector<double> density(count);
              for (std::size_t a = 0; a < count; ++a) {
                density[a] = (static_cast<int>(a % 11) - 5) * 0.013;
                for (std::size_t b = 0; b < count; ++b) {
                  eri[a * count + b] =
                      (1.0 + static_cast<double>((a * 17 + b * 13) % 97)) * 1.0e-5;
                }
              }

              auto spec = make_hf_fock_spec(FockSpin::Restricted, FockApproximation::Exact);
              spec.derivative_order = 0;
              spec.exchange.present = false;
              spec.exchange.coefficient = 0.0;
              const auto strategy = resolve_fock_build(spec, FockBackend::Cpu);

              DirectJkMatrices out;
              for (int i = 0; i < 5; ++i)
                out = build_exact_direct_jk(strategy, n, eri, density);

              std::vector<double> samples;
              constexpr int repeats = 30;
              for (int s = 0; s < 11; ++s) {
                const auto start = Clock::now();
                for (int r = 0; r < repeats; ++r)
                  out = build_exact_direct_jk(strategy, n, eri, density);
                samples.push_back(
                    std::chrono::duration<double>(Clock::now() - start).count() / repeats);
              }
              const double checksum =
                  std::accumulate(out.coulomb.begin(), out.coulomb.end(), 0.0);
              if (!first) std::cout << ',';
              first = false;
              std::cout << "{\"nbf\":" << n << ",\"seconds\":[";
              for (std::size_t i = 0; i < samples.size(); ++i) {
                if (i) std::cout << ',';
                std::cout << samples[i];
              }
              std::cout << "],\"checksum\":" << checksum << "}";
            }
            std::cout << "]}\n";
          }
          CPP

      - name: Run J-only microbenchmark on both revisions
        run: |
          for label in base head; do
            root="/tmp/vq-${label}"
            g++ -std=c++20 -O3 -DNDEBUG               -I"$root/src" -I"$root/include"               /tmp/jonly_probe.cpp               -L"$root/build" -Wl,-rpath,"$root/build" -lvibeqc               -o "/tmp/jonly-${label}"
            "/tmp/jonly-${label}" | tee "/tmp/jonly-${label}.json"
          done

      - name: Write PBE-RKS warm endpoint benchmark
        run: |
          cat >/tmp/pbe_endpoint.py <<'PY'
          import json
          import statistics
          import sys
          from time import perf_counter

          label, root, output = sys.argv[1:4]
          sys.path.insert(0, root + "/python")
          from vibeqc import Calculator

          atoms = [
              ("O", (0.000000, 0.000000, 0.000000)),
              ("H", (0.000000, -1.432337, 1.107153)),
              ("H", (0.000000, 1.432337, 1.107153)),
              ("O", (0.000000, 0.000000, 5.000000)),
              ("H", (0.000000, -1.432337, 6.107153)),
              ("H", (0.000000, 1.432337, 6.107153)),
          ]
          calc = Calculator(
              method="pbe-rks",
              basis="def2-svp",
              device="cpu",
              density_fitting="none",
              energy_tolerance=1e-10,
              density_tolerance=1e-8,
              screening_tolerance=1e-12,
              max_iterations=100,
          )
          first = calc.singlepoint(atoms, properties=("energy",))
          with calc.prepare_batch([atoms]) as plan:
              warm = plan.execute(strict=True)
              samples = []
              outputs = []
              for _ in range(7):
                  start = perf_counter()
                  result = plan.execute(strict=True)
                  samples.append(perf_counter() - start)
                  item = result.items[0] if hasattr(result, "items") else result
                  outputs.append({
                      "energy": item.energy,
                      "iterations": item.iterations,
                      "converged": item.converged,
                      "energy_change": item.energy_change,
                      "density_rms": item.density_rms,
                      "backend": item.executed_backend,
                  })
          record = {
              "label": label,
              "initial_energy": first.energy,
              "samples": samples,
              "median_seconds": statistics.median(samples),
              "outputs": outputs,
          }
          with open(output, "w") as f:
              json.dump(record, f, indent=2)
          print(json.dumps(record))
          PY

          for label in base head; do
            root="/tmp/vq-${label}"
            PYTHONPATH="$root/python" VIBEQC_LIBRARY="$root/build/libvibeqc.so"               python3 /tmp/pbe_endpoint.py "$label" "$root" "/tmp/pbe-${label}.json"
          done

      - name: Compare numerical identity and timing
        run: |
          python3 - <<'PY'
          import json
          import statistics

          with open("/tmp/jonly-base.json") as f:
              jb = json.load(f)
          with open("/tmp/jonly-head.json") as f:
              jh = json.load(f)
          with open("/tmp/pbe-base.json") as f:
              pb = json.load(f)
          with open("/tmp/pbe-head.json") as f:
              ph = json.load(f)

          summary = {
              "j_provider_base": jb["provider"],
              "j_provider_head": jh["provider"],
              "j_rows": [],
              "pbe": {
                  "baseline_median_seconds": pb["median_seconds"],
                  "head_median_seconds": ph["median_seconds"],
                  "ratio": ph["median_seconds"] / pb["median_seconds"],
                  "max_energy_abs_error": max(
                      abs(a["energy"] - b["energy"])
                      for a, b in zip(pb["outputs"], ph["outputs"])
                  ),
                  "iterations_equal": [x["iterations"] for x in pb["outputs"]]
                      == [x["iterations"] for x in ph["outputs"]],
                  "all_converged": all(x["converged"] for x in pb["outputs"] + ph["outputs"]),
                  "backend_base": sorted({x["backend"] for x in pb["outputs"]}),
                  "backend_head": sorted({x["backend"] for x in ph["outputs"]}),
              },
          }
          for b, h in zip(jb["rows"], jh["rows"]):
              summary["j_rows"].append({
                  "nbf": b["nbf"],
                  "baseline_median_seconds": statistics.median(b["seconds"]),
                  "head_median_seconds": statistics.median(h["seconds"]),
                  "ratio": statistics.median(h["seconds"]) / statistics.median(b["seconds"]),
                  "checksum_abs_error": abs(b["checksum"] - h["checksum"]),
              })

          with open("/tmp/summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2))

          assert all(row["checksum_abs_error"] < 1e-10 for row in summary["j_rows"])
          assert summary["pbe"]["max_energy_abs_error"] < 2e-9
          assert summary["pbe"]["iterations_equal"]
          assert summary["pbe"]["all_converged"]
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-1277-ab
          path: |
            /tmp/jonly-base.json
            /tmp/jonly-head.json
            /tmp/pbe-base.json
            /tmp/pbe-head.json
            /tmp/summary.json
          retention-days: 3
