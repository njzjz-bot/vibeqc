name: bench-1277-threshold

on:
  push:
    branches: ["bench/1277-threshold"]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 8dc85b3fa6cc15b3bf93b765498e6b641160e63b
      HEAD_SHA: ec6348f359157e62eceb547a269bd677cadfca90
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libopenblas-dev python3-numpy
      - name: Build matched revisions
        run: |
          git worktree add --detach /tmp/vq-base "$BASE_SHA"
          git worktree add --detach /tmp/vq-head "$HEAD_SHA"
          for label in base head; do
            root="/tmp/vq-${label}"
            cmake -S "$root" -B "$root/build" -G Ninja -DVIBEQC_ENABLE_CUDA=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build "$root/build" --parallel 4
          done
      - name: Write J probe
        run: |
          cat >/tmp/jprobe.cpp <<'CPP'
          #include <chrono>
          #include <cstddef>
          #include <iomanip>
          #include <iostream>
          #include <numeric>
          #include <vector>
          #include "scf/fock_build.hpp"
          using Clock=std::chrono::steady_clock;
          int main(){
            using namespace vibeqc::scf;
            std::cout<<std::setprecision(17)<<"{\"rows\":[";
            bool first=true;
            for(std::size_t n:{24u,32u,40u,48u}){
              const std::size_t count=n*n;
              std::vector<double> eri(count*count),d(count);
              for(std::size_t a=0;a<count;++a){
                d[a]=(static_cast<int>(a%11)-5)*0.013;
                for(std::size_t b=0;b<count;++b)
                  eri[a*count+b]=(1.0+double((a*17+b*13)%97))*1e-5;
              }
              auto spec=make_hf_fock_spec(FockSpin::Restricted,FockApproximation::Exact);
              spec.derivative_order=0; spec.exchange.present=false; spec.exchange.coefficient=0.0;
              const auto strategy=resolve_fock_build(spec,FockBackend::Cpu);
              DirectJkMatrices out;
              for(int i=0;i<4;++i) out=build_exact_direct_jk(strategy,n,eri,d);
              std::vector<double> s;
              constexpr int repeats=20;
              for(int k=0;k<9;++k){
                auto t=Clock::now();
                for(int r=0;r<repeats;++r) out=build_exact_direct_jk(strategy,n,eri,d);
                s.push_back(std::chrono::duration<double>(Clock::now()-t).count()/repeats);
              }
              if(!first) std::cout<<','; first=false;
              std::cout<<"{\"nbf\":"<<n<<",\"seconds\":[";
              for(std::size_t i=0;i<s.size();++i){if(i)std::cout<<',';std::cout<<s[i];}
              std::cout<<"],\"checksum\":"<<std::accumulate(out.coulomb.begin(),out.coulomb.end(),0.0)<<"}";
            }
            std::cout<<"]}\n";
          }
          CPP
          for label in base head; do
            root="/tmp/vq-${label}"
            g++ -std=c++20 -O3 -DNDEBUG -I"$root/src" -I"$root/include" /tmp/jprobe.cpp               -L"$root/build" -Wl,-rpath,"$root/build" -lvibeqc -o "/tmp/j-${label}"
            "/tmp/j-${label}" | tee "/tmp/j-${label}.json"
          done
      - name: Write PBE endpoint probe
        run: |
          cat >/tmp/pbe.py <<'PY'
          import json,statistics,sys
          from time import perf_counter
          label,root,out=sys.argv[1:4]
          sys.path.insert(0,root+"/python")
          from vibeqc import Calculator
          water=[("O",(0.,0.,0.)),("H",(0.,-1.432337,1.107153)),("H",(0.,1.432337,1.107153))]
          cases={
            "water":water,
            "dimer":water+[(s,(x,y,z+5.0)) for s,(x,y,z) in water],
          }
          def run_case(atoms):
            calc=Calculator(method="pbe-rks",basis="def2-svp",device="cpu",density_fitting="none",
              energy_tolerance=1e-10,density_tolerance=1e-8,screening_tolerance=1e-12,max_iterations=100)
            calc.singlepoint(atoms,properties=("energy",))
            systems=[]
            for shift in (0.,0.002,0.004,0.006):
              systems.append([(s,(x,y,z+(shift if i==len(atoms)-1 else 0.))) for i,(s,(x,y,z)) in enumerate(atoms)])
            result={}
            for name,ss,samples in (("single",[atoms],5),("batch4",systems,3)):
              with calc.prepare_batch(ss) as plan:
                plan.execute(strict=True)
                ts=[]; outputs=[]
                for _ in range(samples):
                  t=perf_counter(); rr=plan.execute(strict=True); ts.append(perf_counter()-t)
                  items=rr.items if hasattr(rr,"items") else (rr,)
                  outputs.append([{"energy":x.energy,"iterations":x.iterations,"converged":x.converged} for x in items])
              result[name]={"seconds":ts,"median":statistics.median(ts),"outputs":outputs}
            return result
          rec={"label":label,"cases":{k:run_case(v) for k,v in cases.items()}}
          with open(out,"w") as f: json.dump(rec,f,indent=2)
          print(json.dumps(rec))
          PY
          for label in base head; do
            root="/tmp/vq-${label}"
            PYTHONPATH="$root/python" VIBEQC_LIBRARY="$root/build/libvibeqc.so"               python3 /tmp/pbe.py "$label" "$root" "/tmp/pbe-${label}.json"
          done
      - name: Compare
        run: |
          python3 - <<'PY'
          import json,statistics
          jb=json.load(open("/tmp/j-base.json")); jh=json.load(open("/tmp/j-head.json"))
          pb=json.load(open("/tmp/pbe-base.json")); ph=json.load(open("/tmp/pbe-head.json"))
          out={"j":[],"pbe":{}}
          for b,h in zip(jb["rows"],jh["rows"]):
            bm,hm=statistics.median(b["seconds"]),statistics.median(h["seconds"])
            out["j"].append({"nbf":b["nbf"],"base":bm,"head":hm,"ratio":hm/bm,"error":abs(b["checksum"]-h["checksum"])})
          for case in pb["cases"]:
            out["pbe"][case]={}
            for ep in ("single","batch4"):
              b,h=pb["cases"][case][ep],ph["cases"][case][ep]
              err=0.; same=True; conv=True
              for bo,ho in zip(b["outputs"],h["outputs"]):
                same &= [x["iterations"] for x in bo]==[x["iterations"] for x in ho]
                conv &= all(x["converged"] for x in bo+ho)
                for x,y in zip(bo,ho): err=max(err,abs(x["energy"]-y["energy"]))
              out["pbe"][case][ep]={"base":b["median"],"head":h["median"],"ratio":h["median"]/b["median"],
                                    "max_energy_error":err,"iterations_equal":same,"converged":conv}
          print(json.dumps(out,indent=2))
          json.dump(out,open("/tmp/summary.json","w"),indent=2)
          assert all(x["error"]<1e-10 for x in out["j"])
          assert all(v["max_energy_error"]<2e-9 and v["iterations_equal"] and v["converged"]
                     for c in out["pbe"].values() for v in c.values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-1277-threshold
          path: /tmp/summary.json
          retention-days: 3
