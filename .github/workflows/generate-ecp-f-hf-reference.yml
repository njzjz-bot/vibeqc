name: Generate fixed ECP-f HF PySCF reference

# Temporary, branch-specific acquisition; remove automatic trigger after retention.
on:
  push:
    branches: [oracle/ecp-f-hf-reference-20261012]
    paths:
      - .github/workflows/generate-ecp-f-hf-reference.yml
      - tools/generate_ecp_f_hf_reference.py
      - tools/generate_cpu_hf_high_l_reference.py
      - tools/generate_ecp_raw_matrix_reference.py
      - tests/reference_data/ecp_f_hf/inputs.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecp-f-hf-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate authentic PySCF ECP-f HF receipt
    if: github.repository == 'njzjz-bot/vibeqc' && github.ref == 'refs/heads/oracle/ecp-f-hf-reference-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          python-version: "3.12.12"
          enable-cache: false
      - name: Install only the pinned independent reference dependencies
        run: |
          uv venv --python 3.12.12 .oracle-venv
          uv pip install --python .oracle-venv/bin/python --only-binary=:all: \
            pyscf==2.14.0 numpy==2.3.5 scipy==1.17.0 h5py==3.16.0 threadpoolctl==3.6.0 setuptools==83.0.0
      - name: Generate each profile twice in fresh CPU-only interpreters
        run: |
          ulimit -c 0
          for profile in rhf-cartesian rhf-spherical uhf-cartesian uhf-spherical; do
            for replica in first second; do
              .oracle-venv/bin/python tools/generate_ecp_f_hf_reference.py \
                --profile "$profile" --replica "$replica" \
                --output "oracle-receipts/$profile-$replica.json"
            done
          done
      - name: Validate all eight independent complete receipts
        run: |
          .oracle-venv/bin/python tools/generate_ecp_f_hf_reference.py \
            --verify oracle-receipts/rhf-cartesian-first.json oracle-receipts/rhf-cartesian-second.json \
            oracle-receipts/rhf-spherical-first.json oracle-receipts/rhf-spherical-second.json \
            oracle-receipts/uhf-cartesian-first.json oracle-receipts/uhf-cartesian-second.json \
            oracle-receipts/uhf-spherical-first.json oracle-receipts/uhf-spherical-second.json \
            --output oracle-receipts/manifest.json
      - name: Upload only the bounded scientific receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ecp-f-hf-pyscf-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            oracle-receipts/*.json
          if-no-files-found: error
          retention-days: 14
