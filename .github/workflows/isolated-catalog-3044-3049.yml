name: Isolated CI download contract verification
on:
  push:
    branches:
      - codex/catalog-3044-after-3049-20261108
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact test correction candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e469f1b34a1244fcede58042f22f259a6d33b5f2
          fetch-depth: 0
          persist-credentials: false
      - name: Install the same pinned uv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/download-test-tools"
          "$RUNNER_TEMP/download-test-tools/bin/python" -m pip install --only-binary=:all: uv==0.10.7
          printf '%s\n' "$RUNNER_TEMP/download-test-tools/bin" >> "$GITHUB_PATH"
      - name: Prepare the original CI Python environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_ci_tools.py python-venv
      - name: Install only contract and offline checker dependencies
        run: |
          uv pip install --python .venv/bin/python --only-binary=:all: \
            pytest==9.2.0 pytest-xdist==3.8.0 numpy==2.1.3 \
            'array-api-compat>=1.15.0' 'typing-extensions>=4.0'
      - name: Reproduce the four-worker CI collection contract
        env:
          PYTHONPATH: "${{ github.workspace }}/python:${{ github.workspace }}"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          .venv/bin/python -m pytest -q -p xdist.plugin -n 4 --dist=load \
            tests/python/test_ci_ccache_download.py \
            --junitxml="$RUNNER_TEMP/ci-download-contract.xml"
      - name: Verify exact scope, catalog and retained evidence
        env:
          PYTHONPATH: "${{ github.workspace }}/python:${{ github.workspace }}"
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          assert git("rev-parse", "HEAD") == "e469f1b34a1244fcede58042f22f259a6d33b5f2"
          assert git("rev-parse", "HEAD^{tree}") == "7021de6ef8feae35649c1d98a75dd64af6e19a3a"
          expected = {
              "tests/python/test_ci_ccache_download.py",
              ".agents/notes/implemented/compatibility/2026-11-08-pinned-ci-tool-download-recovery.md",
          }
          changed = set(git("diff", "--name-only", "4656b0f48ed349ca9a52dbccb292a04bc1b79665", "HEAD").splitlines())
          assert changed == expected, changed
          assert git("rev-parse", "HEAD:tests/python/test_ci_ccache_download.py") == "37ef7e8cf72d0384b48803e2cbd12f4e4122b885"
          assert git("rev-parse", "HEAD:.agents/notes/implemented/compatibility/2026-11-08-pinned-ci-tool-download-recovery.md") == "c683649eaeefcfc8fdf5c05b2515cadd720cd83f"
          for path in (".github/scripts/prepare_ci_tools.py", ".github/workflows/ci.yml", ".github/workflows/docs.yml"):
              assert git("rev-parse", "HEAD:" + path) == git("rev-parse", "4656b0f48ed349ca9a52dbccb292a04bc1b79665:" + path)
          def inventory(ref):
              return [path for path in git("ls-tree", "-r", "--name-only", ref, "tests/python").splitlines() if path.endswith(".py")]
          assert inventory("HEAD") == inventory("4656b0f48ed349ca9a52dbccb292a04bc1b79665")
          assert sys.version_info[:3] == (3, 11, 14), sys.version
          subprocess.run([sys.executable, "tools/check_libxc_native_catalog.py"], check=True)
          subprocess.run([sys.executable, "tools/compact_evidence_publications.py", "--check"], check=True)
          evidence_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-test-correction-evidence.json"
          subprocess.run([sys.executable, "tools/evidence.py", "check-change", "--base", "1eeb9a20e7d4350f2dbbeaa736f59144def5348b", "--output", str(evidence_path)], check=True)
          evidence = json.loads(evidence_path.read_text())
          assert not evidence["errors"], evidence
          assert evidence["changed_bytes"] == 381177
          assert evidence["exempt_bytes"] == 0
          junit = ET.parse(pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-download-contract.xml")
          suites = list(junit.getroot().iter("testsuite"))
          tests = sum(int(x.attrib.get("tests", 0)) for x in suites)
          failures = sum(int(x.attrib.get("failures", 0)) + int(x.attrib.get("errors", 0)) + int(x.attrib.get("skipped", 0)) for x in suites)
          assert tests == 21 and failures == 0, (tests, failures)
          subprocess.run(["git", "diff", "--check"], check=True)
          assert git("status", "--porcelain") == "", git("status", "--porcelain")
          result = {
              "candidate": "e469f1b34a1244fcede58042f22f259a6d33b5f2", "tree": "7021de6ef8feae35649c1d98a75dd64af6e19a3a",
              "test_blob": "37ef7e8cf72d0384b48803e2cbd12f4e4122b885",
              "note_blob": "c683649eaeefcfc8fdf5c05b2515cadd720cd83f",
              "python": sys.version.split()[0], "pytest": __import__("pytest").__version__,
              "workers": 4, "tests_passed": tests,
              "production_helper_and_workflows": "unchanged",
              "test_module_inventory": "unchanged",
              "catalog": "original read-only checker passed",
              "publication_compaction": "passed", "evidence": evidence,
              "clean_checkout": True,
          }
          print("CI_TEST_CORRECTION_PREFLIGHT_BEGIN")
          print(json.dumps(result, indent=2, sort_keys=True))
          print("CI_TEST_CORRECTION_PREFLIGHT_END")
          PY
