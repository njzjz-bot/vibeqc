name: Isolated ccache download diagnosis

on:
  push:
    branches:
      - codex/catalog-3044-after-3049-20261108

permissions:
  contents: read

jobs:
  download:
    if: github.repository == 'njzjz-bot/vibeqc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the same official ccache archive through both entry points
        shell: bash
        env:
          CCACHE_PROBE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path
          
          expected = "45a91165db7092e67c6208ada03f54700e684c4cd3735f9031de95669ed9272c"
          root = Path(os.environ["RUNNER_TEMP"]) / "ccache-download-probe"
          root.mkdir()
          cases = [
              ("original_release", "https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-linux-x86_64-glibc.tar.xz", []),
              ("official_asset_api", "https://api.github.com/repos/ccache/ccache/releases/assets/526043228", [
                  "--header", "Accept: application/octet-stream",
                  "--header", "X-GitHub-Api-Version: 2022-11-28",
                  "--header", "Authorization: Bearer " + os.environ["CCACHE_PROBE_TOKEN"],
              ]),
          ]
          results = []
          valid = None
          for name, url, headers in cases:
              archive = root / (name + ".tar.xz")
              header_file = root / (name + ".headers")
              command = [
                  "curl", "--fail", "--silent", "--show-error", "--location",
                  "--retry", "3", "--retry-delay", "2", "--retry-max-time", "60",
                  "--connect-timeout", "15", "--max-time", "60",
                  "--dump-header", str(header_file), "--output", str(archive),
                  "--write-out", "%{http_code} %{num_redirects} %{size_download} %{time_total}",
                  *headers, url,
              ]
              run = subprocess.run(command, capture_output=True, text=True)
              data = archive.read_bytes() if archive.exists() else b""
              digest = hashlib.sha256(data).hexdigest()
              verified = run.returncode == 0 and len(data) == 1344580 and digest == expected
              selected_headers = []
              if header_file.exists():
                  for line in header_file.read_text(errors="replace").splitlines():
                      if line.lower().startswith(("http/", "server:", "x-github-request-id:", "x-cache:", "via:")):
                          selected_headers.append(line)
              result = {
                  "endpoint": name,
                  "returncode": run.returncode,
                  "transfer": run.stdout.strip(),
                  "stderr": run.stderr.strip(),
                  "bytes": len(data),
                  "sha256": digest,
                  "verified_original_asset": verified,
                  "response_headers": selected_headers,
              }
              print(json.dumps(result, sort_keys=True), flush=True)
              results.append(result)
              if verified:
                  valid = archive
          version = None
          if valid is not None:
              extracted = root / "verified-extraction"
              extracted.mkdir()
              with tarfile.open(valid) as archive:
                  archive.extractall(extracted, filter="data")
              binary = extracted / "ccache-4.14-linux-x86_64-glibc" / "ccache"
              run = subprocess.run([str(binary), "--version"], capture_output=True, text=True)
              version = {"returncode": run.returncode, "first_line": run.stdout.splitlines()[0] if run.stdout else "", "stderr": run.stderr}
              if run.returncode or version["first_line"] != "ccache version 4.14":
                  raise RuntimeError("Verified upstream ccache did not report expected version")
          receipt = {"asset_id": 526043228, "expected_bytes": 1344580, "expected_sha256": expected, "probes": results, "version": version}
          print("CCACHE_PROBE_RESULT_BEGIN")
          print(json.dumps(receipt, sort_keys=True, separators=(",", ":")))
          print("CCACHE_PROBE_RESULT_END")
          if valid is None:
              raise SystemExit(1)
          
          PY
