name: Astra review 1444-1453
on:
  push:
    branches: [review/astra-1444-1453-20260927]
    paths:
      - .github/workflows/astra-review-1444-1453.yml
      - .github/scripts/astra-next-review.py
      - .github/scripts/astra-fix-xc-binding.py
permissions:
  contents: write
concurrency:
  group: astra-review-1444-1453
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Isolated fork-only review and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email '48687836+njzjz-bot@users.noreply.github.com'
          git remote add upstream https://github.com/jinzhezenggroup/vibeqc.git
          git fetch --no-tags upstream master \
            +refs/pull/1444/head:refs/remotes/upstream/pr-1444 \
            +refs/pull/1448/head:refs/remotes/upstream/pr-1448 \
            +refs/pull/1452/head:refs/remotes/upstream/pr-1452 \
            +refs/pull/1453/head:refs/remotes/upstream/pr-1453
          python3 -m venv /tmp/astra-review-env
          /tmp/astra-review-env/bin/pip -q install pytest numpy scipy sympy pyyaml ruff
          /tmp/astra-review-env/bin/python .github/scripts/astra-next-review.py
      - name: Retain diagnostics only on scratch branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add _review/astra-1444-1453
          if ! git diff --cached --quiet; then
            git commit -m 'chore(review): retain integration and regression evidence' -m 'Agent: ChatGPT' -m 'Model: GPT-6 Astra Pro'
            git push origin HEAD:refs/heads/review/astra-1444-1453-20260927
          fi
